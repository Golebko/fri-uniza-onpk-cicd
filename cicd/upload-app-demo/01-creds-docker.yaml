#   printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$AUTH" > ~/lab-secrets/config.json
#   unset DOCKERHUB_TOKEN AUTH
#
#   kubectl create secret generic docker-credentials \
#     --from-file=config.json="$HOME/lab-secrets/config.json"
